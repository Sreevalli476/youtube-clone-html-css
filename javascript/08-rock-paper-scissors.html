<!DOCTYPE html>
<html>
<head>
  <title>Rock Paper Scissors</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f8ff;
      text-align: center;
    }

    h1 {
      color: black;
      margin-bottom: 30px;
      display: inline-block;
      padding: 15px 30px;
      border: 3px solid black;
      border-radius: 15px;
      background-color: coral;

      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .button-container {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .move-button {
      width: 120px;
      height: 120px;
      border-radius: 10%;
      border: 4px solid black;
      background: white;
      cursor: pointer;
      margin: 15px;
      transition: transform 0.2s;
    }

   .move-button:hover{
      transform: scale(1.2);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      border-color: #ff6347; 
    }

    .move-button img {
      width: 100px;
      height: 100px;
    }

    .result {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
    }

    .score {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .win { color: green; }
    .lose { color: red; }
    .tie { color: #1E90FF; }

    .reset-btn {
      margin-top: 30px;
      padding: 10px 20px;
      font-size: 30px;
      font-family: Arial, sans-serif;
      cursor: pointer;
      border-radius: 20px;
      font-weight: bold;
      background-color:rgba(24, 218, 185, 0.729);
}
  </style>
</head>

<body>

  <h1>Rock Paper Scissors</h1>

  <div class="button-container">
    <button class="move-button" onclick="playGame('rock')">
      <img src="images/rock.png" alt="Rock">
    </button>

    <button class="move-button" onclick="playGame('paper')">
      <img src="images/paper.png" alt="Paper">
    </button>

    <button class="move-button" onclick="playGame('scissors')">
      <img src="images/scisssors.png" alt="Scissors">
    </button>
  </div>

  <div id="result"></div>
  <div id="score"></div>

  <button class="reset-btn" onclick="resetScore()">Reset Score</button>

  <script>
   
    let score = JSON.parse(localStorage.getItem('score')) || {
    wins: 0,
    losses: 0,
    ties: 0
};

updateScore();

function playGame(playerMove) {
  const randomNumber = Math.random();
  let computerMove = '';

  if (randomNumber < 1 / 3) {
    computerMove = 'rock';
  } else if (randomNumber < 2 / 3) {
    computerMove = 'paper';
  } else {
    computerMove = 'scissors';
  }

  let resultText = '';
  let resultClass = '';

  if (playerMove === computerMove) {
    resultText = "It's a Tie 🤝";
    resultClass = 'tie';
    score.ties++;
  } else if (
    (playerMove === 'rock' && computerMove === 'scissors') ||
    (playerMove === 'paper' && computerMove === 'rock') ||
    (playerMove === 'scissors' && computerMove === 'paper')
  ) {
    resultText = "You Win 🎉";
    resultClass = 'win';
    score.wins++;
  } else {
    resultText = "You Lose 😢";
    resultClass = 'lose';
    score.losses++;
  }

  document.getElementById('result').textContent = resultText;
  document.getElementById('result').className = resultClass;

  localStorage.setItem('score', JSON.stringify(score)); 
  updateScore();
}

function updateScore() {
  document.getElementById('score').textContent =
    `Wins: ${score.wins} | Losses: ${score.losses} | Ties: ${score.ties}`;
}

function resetScore() {
  score = { wins: 0, losses: 0, ties: 0 };
  localStorage.removeItem('score');
  document.getElementById('result').textContent = '';
  updateScore();
}
</script>

</body>
</html>
