<!DOCTYPE html>
    <html>
    <head>
      <title>TO-DO-LIST</title>
    </head>
    <style>
      body{
        font-family: Arial, Helvetica, sans-serif;

      }
      .todo-grid,.todo-input-grid {
        display: grid;
        grid-template-columns: 200px 150px 100px;
        column-gap: 10px;
        row-gap:10px;
        align-items: center;
      
      }
      .todo-input-grid{
        margin-bottom: 10px;
        align-items: stretch;
      }
      .name-input,.due-date-input{
        font-size: 15px;
        padding: 6px;
      }
      .add-todo-button{
        background-color: green;
        color: white;
        border: none;
        font-size: 15px;
        cursor: pointer;
       
      }
        .delete-todo-button{
          background-color: darkred;
          color: white;
          border: none;
          font-size: 15px;
          cursor: pointer;
          padding-top: 10px;
          padding-bottom: 10px;
        }
    </style>
       

        <body>
          <P>TODO LIST</P>
          <div class="todo-input-grid">
              <input placeholder="Todo name"
              class="js-name-input name-input">
              <input type="date"
              class="js-duedate-input due-date-input">
              <button
              class="add-todo-button js-add-todo-button">Add</button>
              <div class="js-todo-list todo-grid"></div>
              
          </div>
           
          <script>
           const todolist=[{name: 'make dinner',
            dueDate:'2026-02-01'},{name:' wash clothes',
          dueDate: '2026-02-07'}];
           
           
           renderTodolist();
           function renderTodolist(){
           let todolistHTML='';
           
           todolist.forEach((todoObject,index)=>{
            const {name,dueDate}=todoObject;
            
            const html=`
            <div>${name}</div>
            <div> ${dueDate}</div>
               <button onclick=" 
               todolist.splice(${index},1);
               renderTodolist(); 
               
               " class="delete-todo-button">Delete</button>
               `;
           todolistHTML+=html;
          
           });
          
          
           document.querySelector('.js-todo-list')
           .innerHTML=todolistHTML;
          }

          document.querySelector('.js-add-todo-button')
          .addEventListener('click',()=>{
            addtodo();
          })


           function addtodo(){
           const inputelement=document.querySelector('.js-name-input');
           const name=inputelement.value;
           const dateInputElement=document.querySelector('.js-duedate-input');
           const dueDate=dateInputElement.value;
           todolist.push({name: name,dueDate:dueDate});
           
           inputelement.value='';
           renderTodolist();
           }
          
           </script>

            
        </body>
    </html>
