<!DOCTYPE html>
<html>
<head>
  <title>Rock Paper Scissors</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: black;
      text-align: center;
    }

    h1 {
      color: black;
      margin-bottom: 30px;
      display: inline-block;
      padding: 15px 30px;
      border: 3px solid black;
      border-radius: 15px;
      background-color:rgb(141, 233, 241);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .button-container {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .move-button {
      width: 130px;
      height: 130px;
      border-radius: 100px;
      border: 3px solid white;
      background: transparent;
      cursor: pointer;
      margin: 15px;
      transition: transform 0.2s;
    }

    .move-button:hover {
      transform: scale(1.2);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      border-color: #ff6347;
    }

    .move-button img {
      width: 100px;
      height: 100px;
    }

    .hidden {
      display: none;
    }

    .moves-display {
      display: flex;
      justify-content: center;
      gap: 60px;
      margin-top: 40px;
      color: white;
    }

    .move-img {
      width: 100px;
      height: 100px;
    }

    .result {
      margin-top: 30px;
      font-size: 25px;
      font-weight: bold;
    }

    .score {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: white;
    }

    .win { color: green; }
    .lose { color: red; }
    .tie { color: #1E90FF; }

    .reset-btn {
      margin-top: 30px;
      padding: 10px 20px;
      font-size: 24px;
      font-family: Arial;
      cursor: pointer;
      border-radius: 20px;
      font-weight: bold;
      background-color:#f08383;
      border: none;
    }
  </style>
</head>

<body>

  <h1>Rock Paper Scissors</h1>

  <!-- Buttons always visible -->
  <div class="button-container">
    <button class="move-button" onclick="playGame('rock')">
      <img src="images/rock-emoji.png">
    </button>

    <button class="move-button" onclick="playGame('paper')">
      <img src="images/paper-emoji.png">
    </button>

    <button class="move-button" onclick="playGame('scissors')">
      <img src="images/scissors-emoji.png">
    </button>
  </div>

  <!-- Hidden game area -->
  <div id="play-area" class="hidden">
    <div class="moves-display">
      <div>
        <p>You</p>
        <img id="player-move" class="move-img">
      </div>

      <div>
        <p>Computer</p>
        <img id="computer-move" class="move-img">
      </div>
    </div>

    <div id="result" class="result"></div>
  </div>

  <!-- Score always visible -->
  <div id="score" class="score"></div>

  <button class="reset-btn" onclick="resetScore()">Reset Score</button>

  <script>
    let score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0,
      ties: 0
    };

    updateScore();

    function playGame(playerMove) {
      document.getElementById('play-area').style.display = 'block';

      const randomNumber = Math.random();
      let computerMove = '';

      if (randomNumber < 1/3) computerMove = 'rock';
      else if (randomNumber < 2/3) computerMove = 'paper';
      else computerMove = 'scissors';

      let resultText = '';
      let resultClass = '';

      if (playerMove === computerMove) {
        resultText = "It's a Tie 🤝";
        resultClass = 'tie';
        score.ties++;
      } else if (
        (playerMove === 'rock' && computerMove === 'scissors') ||
        (playerMove === 'paper' && computerMove === 'rock') ||
        (playerMove === 'scissors' && computerMove === 'paper')
      ) {
        resultText = "You Win 🎉";
        resultClass = 'win';
        score.wins++;
      } else {
        resultText = "You Lose 😢";
        resultClass = 'lose';
        score.losses++;
      }

      document.getElementById('player-move').src =
        `images/${playerMove}-emoji.png`;
      document.getElementById('computer-move').src =
        `images/${computerMove}-emoji.png`;

      const resultDiv = document.getElementById('result');
      resultDiv.textContent = resultText;
      resultDiv.className = `result ${resultClass}`;

      localStorage.setItem('score', JSON.stringify(score));
      updateScore();
    }

    function updateScore() {
      document.getElementById('score').textContent =
        `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
    }

    function resetScore() {
      score = { wins: 0, losses: 0, ties: 0 };
      localStorage.removeItem('score');
      updateScore();

      document.getElementById('play-area').style.display = 'none';
      document.getElementById('player-move').src = '';
      document.getElementById('computer-move').src = '';
      document.getElementById('result').textContent = '';
    }
  </script>

</body>
</html>
